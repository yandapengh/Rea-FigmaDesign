<!doctype html>
<html><head><meta charset="utf-8"><style>
:root{--bg:#1e1e1e;--panel:#2c2c2c;--line:#3d3d3d;--text:#e6e6e6;--muted:#9a9a9a;--accent:#0d99ff;--ok:#14ae5c;--warn:#d9a300;--err:#f24822}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:12px/1.5 Inter,-apple-system,"PingFang TC",sans-serif;height:100vh;display:flex;flex-direction:column}
.head{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:600}
.logo{width:16px;height:16px;border-radius:4px;background:linear-gradient(135deg,var(--accent),#7a5cff)}
.dot{margin-left:auto;font-size:10px;color:var(--muted)}
.file{padding:7px 12px;border-bottom:1px solid var(--line);color:var(--muted);display:flex;justify-content:space-between}
.sum{padding:8px 12px;display:flex;gap:10px;color:var(--muted);border-bottom:1px solid var(--line);font-size:11px}
.sum b{color:var(--text)}
.hint{margin:8px 12px 4px;padding:7px 9px;background:#233042;border:1px solid #2f4a66;border-radius:6px;color:#bcd6f5;font-size:11px}
.actions{display:flex;gap:6px;padding:0 12px 6px}
.actions button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:5px;padding:2px 7px;font-size:10px;cursor:pointer}
.list{flex:1;overflow:auto;padding:0 6px}
.row{display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:5px}
.row:hover{background:#262626}.idx{color:var(--muted);font-size:9px;width:14px;text-align:right}
.name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:9px;padding:1px 6px;border-radius:99px;white-space:nowrap}
.done{background:#173225;color:#6fe0a4}.todo{background:#2a2a2a;color:#9a9a9a}.warn{background:#33290f;color:#e0b64a}.skip{background:#262626;color:#6f6f6f}
.meta{font-size:9px;color:var(--muted);white-space:nowrap}
.foot{border-top:1px solid var(--line);padding:8px 12px;display:flex;gap:8px;align-items:center}
.primary{flex:1;background:var(--accent);color:#fff;border:0;border-radius:6px;padding:7px;font-weight:600;font-size:11px;cursor:pointer}
.danger{background:none;border:0;color:var(--err);font-size:10px;cursor:pointer}
.prog{padding:8px 12px;border-top:1px solid var(--line)}
.ptop{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:4px}
.bar{height:5px;background:#3a3a3a;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--accent)}
.stage{font-size:10px;color:#bcd6f5;margin-top:4px}
.err{margin:6px 12px;padding:8px;border:1px solid #5c241c;background:#2a1613;border-radius:6px;font-size:10px;color:#f5b3a6}
.err b{display:block;color:#ff8a75;margin-bottom:3px}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center}
.dialog{width:270px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:11px}
.dialog h4{margin:0 0 6px}.dialog p{margin:0 0 10px;color:var(--muted)}
.dialog .r{display:flex;gap:8px;justify-content:flex-end}
.dialog button{border-radius:5px;padding:5px 9px;font-size:10px;border:1px solid var(--line);background:none;color:#ddd;cursor:pointer}
.dialog .red{background:var(--err);border-color:var(--err);color:#fff}
.hidden{display:none}
</style></head><body>
<div class="head"><div class="logo"></div><span>Rea-FigmaDesign</span><span class="dot" id="conn">連線中…</span></div>
<div class="file"><span id="fname">等待 Figma…</span><span id="fcount"></span></div>
<div class="sum"><span>已完成 <b id="s-done">0</b></span><span>未導出 <b id="s-todo">0</b></span><span>中斷 <b id="s-warn">0</b></span><span>空頁 <b id="s-skip">0</b></span></div>
<div class="hint" id="hint">正在讀取頁面清單…</div>
<div class="actions"><button id="all">全選</button><button id="todo">僅選未導出</button><button id="none">清除選擇</button></div>
<div class="list" id="list"></div>
<div class="prog hidden" id="prog"><div class="ptop"><span id="pstep"></span><span id="ptime"></span></div><div class="bar"><i id="pbar"></i></div><div class="stage" id="pstage"></div></div>
<div class="err hidden" id="err"><b id="errt"></b><span id="errb"></span></div>
<div class="foot"><button class="primary" id="go">匯出</button><button class="danger" id="clr">清空資料庫</button></div>
<div class="modal hidden" id="modal"><div class="dialog"><h4>清空資料庫？</h4><p>所有已導出的頁面與節點都會刪除，無法復原。</p><div class="r"><button id="no">取消</button><button class="red" id="yes">確定清空</button></div></div></div>
<script>
var WS='ws://localhost:8765', ws=null, fileKey='', fileName='', pages=[], status={}, sel={}, seq=0, starting=0, t0=0, timer=null;
function $id(i){return document.getElementById(i)}
function post(o){parent.postMessage({pluginMessage:o},'*')}
function connect(){ws=new WebSocket(WS);ws.onopen=function(){$id('conn').textContent='● 已連線';$id('conn').style.color='var(--ok)';askStatus();pump()};ws.onclose=function(){$id('conn').textContent='○ 離線';$id('conn').style.color='var(--err)';setTimeout(connect,2000)};ws.onmessage=function(e){var m=JSON.parse(e.data);onAck(m)}}
var outbox=[];
function pump(){if(!ws||ws.readyState!==1)return;while(outbox.length&&ws.bufferedAmount<4*1024*1024){var m=outbox.shift();ws.send(JSON.stringify(m))}if(outbox.length)setTimeout(pump,25)}
function sendRelay(message,batchId){outbox.push({type:message.type,payload:message.payload,batch_id:batchId});pump()}
function onAck(m){if(m.batchId){post({type:'ACK',batchId:m.batchId,status:m.status,error:m.error||''});return}if(m.receivedType==='PAGE_STATUS'&&m.pages){for(var i=0;i<m.pages.length;i++){status[m.pages[i].page_id]=m.pages[i]}render()}}
function askStatus(){if(!fileKey)return;outbox.push({type:'PAGE_STATUS',payload:{file_key:fileKey}});pump()}
window.onmessage=function(e){var m=e.data&&e.data.pluginMessage;if(!m)return;
 if(m.type==='PAGE_META'){fileKey=m.payload.file.file_key;fileName=m.payload.file.file_name;pages=m.payload.pages;$id('fname').textContent=fileName;$id('fcount').textContent=pages.length+' 頁';askStatus();defaults();render();return}
 if(m.type==='RELAY'){sendRelay(m.message,m.batchId);return}
 if(m.type==='PAGE_PROGRESS'){showProgress(m.payload);return}
 if(m.type==='RUN_DONE'){finish(true,m.payload);return}
 if(m.type==='PAGE_ERROR'){showError(m.payload.page+'：'+m.payload.message);return}
 if(m.type==='RUN_ERROR'){finish(false,m.payload);return}}
function st(id){return status[id]?status[id].status:'INCOMPLETE'}
function isDone(id){return st(id)==='DONE'}function isSkip(id){return st(id)==='SKIPPED'}
function defaults(){var n=pages.length,count=0;sel={};for(var i=0;i<n;i++){var p=pages[i];if(isSkip(p.page_id))continue;if(n<=8){sel[p.page_id]=true;count++}else if(!isDone(p.page_id)&&count<4){sel[p.page_id]=true;count++}}$id('hint').textContent=n<=8?'小檔案：已全選 '+count+' 頁，按一下即可匯出。':'頁數較多，已預選 '+count+' 個未導出頁面；建議每次 3–5 頁。'}
function render(){var l=$id('list');l.innerHTML='';var c={done:0,todo:0,warn:0,skip:0};for(var i=0;i<pages.length;i++){var p=pages[i],s=st(p.page_id);var cls=s==='DONE'?'done':s==='SKIPPED'?'skip':s==='SYNCING'?'warn':'todo';c[cls]++;var row=document.createElement('div');row.className='row';var chk=isSkip(p.page_id)?'':'<input type="checkbox" data-id="'+p.page_id+'"'+(sel[p.page_id]?' checked':'')+'>';var meta=status[p.page_id]&&status[p.page_id].node_count?status[p.page_id].node_count.toLocaleString():'';row.innerHTML='<span class="idx">'+(i+1)+'</span>'+chk+'<span class="name">'+p.page_name+'</span><span class="badge '+cls+'">'+(s==='DONE'?'✅ 已導出':s==='SKIPPED'?'— 空頁':s==='SYNCING'?'⚠️ 上次中斷':'⬜ 未導出')+'</span>'+(meta?'<span class="meta">'+meta+'</span>':'');l.appendChild(row)}
 $id('s-done').textContent=c.done;$id('s-todo').textContent=c.todo;$id('s-warn').textContent=c.warn;$id('s-skip').textContent=c.skip;$id('go').disabled=false
 var boxes=l.querySelectorAll('input');for(var b=0;b<boxes.length;b++){boxes[b].onchange=function(ev){sel[ev.target.getAttribute('data-id')]=ev.target.checked;updateGo()}};updateGo()}
function selectedIds(){var a=[];for(var i=0;i<pages.length;i++){if(sel[pages[i].page_id])a.push(pages[i].page_id)}return a}
function updateGo(){var n=selectedIds().length;$id('go').textContent=starting?'匯出中…':'匯出 '+n+' 頁';$id('go').disabled=starting>0||n===0}
function showProgress(p){starting=1;if(!t0){t0=Date.now();timer=setInterval(function(){$id('ptime').textContent=((Date.now()-t0)/1000).toFixed(0)+'s'},500)}$id('prog').classList.remove('hidden');$id('pstep').textContent='第 '+p.index+' / '+p.total+' 頁 · '+p.page;$id('pbar').style.width=Math.round(100*(p.index-1)/p.total)+'%';var map={loading:'正在載入頁面…',streaming:'串流傳輸中：已確認入庫 '+p.committed+' 筆',committing:'原子落盤中…',done:'完成，準備下一頁',skipped:'空頁，已跳過'};$id('pstage').textContent=map[p.stage]||p.stage;updateGo()}
function finish(ok,d){starting=0;t0=0;if(timer){clearInterval(timer);timer=null}$id('prog').classList.add('hidden');if(ok){$id('hint').textContent='本次匯出完成：'+d.pages+' 頁 · 耗時 '+Math.round(d.duration/1000)+' 秒';$id('err').classList.add('hidden')}updateGo();askStatus()}
function showError(t){$id('err').classList.remove('hidden');$id('errt').textContent=t;$id('errb').textContent='在此之前已標記 ✅ 的頁面均已安全入庫。建議：減少勾選頁數、重新整理 Figma 分頁後從未完成頁面繼續；若單頁過大，請拆成兩份檔案分別導出（會合併）。'}
$id('all').onclick=function(){sel={};for(var i=0;i<pages.length;i++)if(!isSkip(pages[i].page_id))sel[pages[i].page_id]=true;render()}
$id('todo').onclick=function(){sel={};for(var i=0;i<pages.length;i++)if(!isDone(pages[i].page_id)&&!isSkip(pages[i].page_id))sel[pages[i].page_id]=true;render()}
$id('none').onclick=function(){sel={};render()}
$id('go').onclick=function(){var ids=selectedIds();if(!ids.length)return;t0=Date.now();starting=1;$id('err').classList.add('hidden');post({action:'START_EXTRACTION',pageIds:ids});updateGo()}
$id('clr').onclick=function(){$id('modal').classList.remove('hidden')}
$id('no').onclick=function(){$id('modal').classList.add('hidden')}
$id('yes').onclick=function(){$id('modal').classList.add('hidden');outbox.push({type:'RESET_DATABASE',payload:{confirm:true},batch_id:++seq});pump();setTimeout(askStatus,800)}
post({action:'REQUEST_META'});connect();
</script></body></html>
